        // Función genérica de grid: calcula cuántas piezas caben por hoja
        function calcularGrid(hojaAncho, hojaAlto, piezaAncho, piezaAlto, gap) {
            if (piezaAncho <= 0 || piezaAlto <= 0 || hojaAncho <= 0 || hojaAlto <= 0) {
                return { porFila: 0, porCol: 0, porHoja: 0 };
            }
            const g = gap > 0 ? gap : 0;
            const porFila = Math.max(Math.floor((hojaAncho + g) / (piezaAncho + g)), 0);
            const porCol = Math.max(Math.floor((hojaAlto + g) / (piezaAlto + g)), 0);
            const porHoja = Math.max(porFila * porCol, 0);
            return { porFila, porCol, porHoja };
        }

        async function iniciarSesion() {
            let usuarioInput = document.getElementById('login-email').value.trim().toLowerCase();
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('btn-login');
            ocultarErrorLogin();
            if (!usuarioInput || !password) { mostrarErrorLogin("Por favor completa todos los campos."); return; }
            let email = usuarioInput.includes('@') ? usuarioInput : `${usuarioInput}${DOMINIO_USUARIO}`;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Verificando...</span>';
            btn.disabled = true;
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (error) {
                let msg = "Error al iniciar sesión.";
                if (error.code === 'auth/user-not-found') msg = "Usuario no encontrado.";
                else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') msg = "Usuario o contraseña incorrectos.";
                else if (error.code === 'auth/invalid-email') msg = "Usuario inválido.";
                else if (error.code === 'auth/too-many-requests') msg = "Demasiados intentos. Espera unos minutos.";
                else if (error.code === 'auth/network-request-failed') msg = "Error de conexión. Revisa tu internet.";
                else msg = error.message;
                mostrarErrorLogin(msg);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i><span>Iniciar Sesión</span>';
                btn.disabled = false;
            }
        }

            toast.innerHTML = `<i class="fa-solid ${tipo === 'success' ? 'fa-circle-check text-[#b88a73]' : 'fa-triangle-exclamation'}"></i><span>${mensaje}</span>`;

        async function fetchBCVRate() {
            const inputEl = document.getElementById('bcv-rate-input');
            const hoyStr = new Date().toISOString().split('T')[0];
            const tasaGuardada = localStorage.getItem('lan_bcv_tasa');
            const fechaGuardada = localStorage.getItem('lan_bcv_fecha');
            if (tasaGuardada && fechaGuardada === hoyStr) {
                tasaBCV = parseFloat(tasaGuardada);
                if (inputEl) inputEl.value = tasaBCV.toFixed(2);
                const t = document.getElementById('presupuesto-tasa-doc'); if (t) t.innerText = `Bs. ${tasaBCV.toFixed(2)}`;
                recalcularPresupuestoTotal();
                return;
            }
            if (inputEl) inputEl.value = "...";
            try {
                const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                if (response.ok) {
                    const data = await response.json();
                    if (data.promedio) {
                        tasaBCV = parseFloat(data.promedio);
                        localStorage.setItem('lan_bcv_tasa', tasaBCV);
                        localStorage.setItem('lan_bcv_fecha', hoyStr);
                        if (inputEl) inputEl.value = tasaBCV.toFixed(2);
                        const t = document.getElementById('presupuesto-tasa-doc'); if (t) t.innerText = `Bs. ${tasaBCV.toFixed(2)}`;
                        recalcularPresupuestoTotal();
                        return;
                    }
                }
                throw new Error("inválido");
            } catch (error) {
                if (tasaGuardada) tasaBCV = parseFloat(tasaGuardada);
                if (inputEl) inputEl.value = tasaBCV.toFixed(2);
                const t = document.getElementById('presupuesto-tasa-doc'); if (t) t.innerText = `Bs. ${tasaBCV.toFixed(2)}`;
                recalcularPresupuestoTotal();
            }
        }

        // ================== FORROS ESCOLARES (GRID) ==================
        function calcularForros() {
            const hojaA = parseFloat(document.getElementById('forr-hoja-ancho').value) || 0;
            const hojaAl = parseFloat(document.getElementById('forr-hoja-alto').value) || 0;
            const cuadA = parseFloat(document.getElementById('forr-cuaderno-ancho').value) || 0;
            const cuadAl = parseFloat(document.getElementById('forr-cuaderno-alto').value) || 0;
            const gap = parseFloat(document.getElementById('forr-gap').value) || 0;
            const cant = parseInt(document.getElementById('forr-cantidad').value) || 1;
            const mermaPct = parseFloat(document.getElementById('forr-merma').value) || 0;
            const gananciaPct = parseFloat(document.getElementById('forr-ganancia').value) || 0;
            const cVinilM2 = parseFloat(document.getElementById('forr-costo-vinil').value) || 0;
            const cLamM2 = parseFloat(document.getElementById('forr-costo-laminado').value) || 0;
            const cTinta = parseFloat(document.getElementById('forr-costo-tinta').value) || 0;
            const cBolsa = parseFloat(document.getElementById('forr-costo-bolsa').value) || 0;
            const cMano = parseFloat(document.getElementById('forr-costo-mano').value) || 0;
            const cDepre = parseFloat(document.getElementById('forr-costo-depre').value) || 0;
            const incluirBolsa = document.getElementById('forr-incluir-bolsa').checked;

            const grid = calcularGrid(hojaA, hojaAl, cuadA, cuadAl, gap);
            const hojasTeoricas = grid.porHoja > 0 ? Math.ceil(cant / grid.porHoja) : 0;
            const hojasReq = Math.ceil(hojasTeoricas * (1 + mermaPct / 100));

            // m² por cuaderno según sus medidas reales
            const m2 = (cuadA * cuadAl) / 10000;
            const cVinil = m2 * cVinilM2;
            const cLaminado = m2 * cLamM2;
            const cBolsaFinal = incluirBolsa ? cBolsa : 0;
            const costoUnit = cVinil + cLaminado + cTinta + cBolsaFinal + cMano + cDepre;
            const precioUnit = costoUnit * (1 + gananciaPct / 100);
            const precioLote = precioUnit * cant;
            const gananciaLote = precioLote - (costoUnit * cant);

            document.getElementById('forr-res-grid').innerText = `${grid.porFila} × ${grid.porCol}`;
            document.getElementById('forr-res-por-hoja').innerText = `${grid.porHoja} uds`;
            document.getElementById('forr-res-hojas-teoricas').innerText = hojasTeoricas;
            document.getElementById('forr-res-hojas-req').innerText = `${hojasReq} hojas`;
            document.getElementById('forr-res-vinil').innerText = `$${cVinil.toFixed(2)}`;
            document.getElementById('forr-res-laminado').innerText = `$${cLaminado.toFixed(2)}`;
            document.getElementById('forr-res-tinta').innerText = `$${cTinta.toFixed(2)}`;
            document.getElementById('forr-res-bolsa').innerText = `$${cBolsaFinal.toFixed(2)}`;
            document.getElementById('forr-res-mano').innerText = `$${cMano.toFixed(2)}`;
            document.getElementById('forr-res-depre').innerText = `$${cDepre.toFixed(2)}`;
            document.getElementById('forr-res-costo-unit').innerText = `$${costoUnit.toFixed(2)}`;
            document.getElementById('forr-res-precio-unit').innerText = `$${precioUnit.toFixed(2)}`;
            document.getElementById('forr-res-precio-lote').innerText = `$${precioLote.toFixed(2)}`;
            document.getElementById('forr-res-ganancia').innerText = `$${gananciaLote.toFixed(2)}`;

            const escalones = [{ min: 1, max: 5, d: 0 }, { min: 6, max: 11, d: 0.05 }, { min: 12, max: 23, d: 0.10 }, { min: 24, max: 50, d: 0.15 }];
            let html = '';
            escalones.forEach(e => {
                const p = precioUnit * (1 - e.d);
                html += `<div class="flex justify-between"><span class="text-gray-600">${e.min === 1 ? '1 ud' : e.min + '-' + e.max + ' uds'} (${(e.d * 100).toFixed(0)}%):</span><span class="font-bold text-[#2c2c2c]">$${p.toFixed(2)}/ud</span></div>`;
            });
            document.getElementById('forr-tabla-volumen').innerHTML = html;
        }

        // ================== STICKERS (GRID) ==================
        function calcularStickers() {
            const aStk = parseFloat(document.getElementById('stk-ancho').value) || 0;
            const alStk = parseFloat(document.getElementById('stk-alto').value) || 0;
            const gap = parseFloat(document.getElementById('stk-gap').value) || 0;
            const cant = parseInt(document.getElementById('stk-cantidad').value) || 1;
            const mermaPct = parseFloat(document.getElementById('stk-merma').value) || 0;
            const aHoja = parseFloat(document.getElementById('stk-hoja-ancho').value) || 21;
            const alHoja = parseFloat(document.getElementById('stk-hoja-alto').value) || 29.7;
            const cMat = parseFloat(document.getElementById('stk-costo-hoja').value) || 0;
            const incLam = document.getElementById('stk-incluir-laminado').checked;
            const cLam = incLam ? parseFloat(document.getElementById('stk-costo-laminado').value) || 0 : 0;
            const cTinta = parseFloat(document.getElementById('stk-costo-tinta').value) || 0;
            const cCuch = parseFloat(document.getElementById('stk-costo-cuchilla').value) || 0;
            const cEmp = parseFloat(document.getElementById('stk-costo-empaque').value) || 0;
            const cFij = parseFloat(document.getElementById('stk-costo-fijos').value) || 0;
            const cManoH = parseFloat(document.getElementById('stk-costo-mano').value) || 0;
            const ganPct = parseFloat(document.getElementById('stk-ganancia').value) || 0;

            const grid = calcularGrid(aHoja, alHoja, aStk, alStk, gap);
            const porHoja = grid.porHoja > 0 ? grid.porHoja : 1;
            const hojasTeoricas = Math.ceil(cant / porHoja);
            const hojasReq = Math.ceil(hojasTeoricas * (1 + mermaPct / 100));

            const costoMaterial = hojasReq * cMat;
            const costoLam = hojasReq * cLam;
            const costoTintaCuch = hojasReq * (cTinta + cCuch);
            const horasMano = (cant * 1.5) / 60;
            const costoMano = horasMano * cManoH;
            const costoEmpFij = (cant * (cEmp + cFij));
            const costoTotal = costoMaterial + costoLam + costoTintaCuch + costoMano + costoEmpFij;
            const costoUnit = cant > 0 ? costoTotal / cant : 0;
            const precioUnit = costoUnit * (1 + ganPct / 100);
            const precioLote = precioUnit * cant;

        function calcularTopper() {
            const hojaA = parseFloat(document.getElementById('top-hoja-ancho').value) || 21;
            const hojaAl = parseFloat(document.getElementById('top-hoja-alto').value) || 29.7;
            const tA = parseFloat(document.getElementById('top-ancho').value) || 0;
            const tAl = parseFloat(document.getElementById('top-alto').value) || 0;
            const gap = parseFloat(document.getElementById('top-gap').value) || 0;
            const cant = parseInt(document.getElementById('top-cantidad').value) || 1;
            const mermaPct = parseFloat(document.getElementById('top-merma').value) || 0;

            const grid = calcularGrid(hojaA, hojaAl, tA, tAl, gap);
            const porHoja = grid.porHoja > 0 ? grid.porHoja : 1;
            const hojasTeoricas = Math.ceil(cant / porHoja);
            const hojasReq = Math.ceil(hojasTeoricas * (1 + mermaPct / 100));

            let cMat = 0;
            document.querySelectorAll('#lista-insumos-topper tr').forEach(row => {
                const c = parseFloat(row.querySelector('.top-mat-cant').value) || 0;
                const co = parseFloat(row.querySelector('.top-mat-costo').value) || 0;
                cMat += c * co;
            });
            let cMo = 0;
            document.querySelectorAll('#lista-mano-obra-topper tr').forEach(row => {

                const tar = parseFloat(row.querySelector('.top-mo-tarifa').value) || 0;
                cMo += (min / 60) * tar;
            });
            const directo = cMat + cMo;
            const gastosPct = parseFloat(document.getElementById('top-gastos-pct').value) || 0;
            const gastos = directo * (gastosPct / 100);
            const costoTotal = directo + gastos;
            const costoUnit = cant > 0 ? costoTotal / cant : 0;
            const ganPct = parseFloat(document.getElementById('top-ganancia').value) || 0;
            const precioUnit = costoUnit * (1 + ganPct / 100);

            const ganancia = precioLote - costoTotal;

            document.getElementById('top-res-grid').innerText = `${grid.porFila} × ${grid.porCol}`;
            document.getElementById('top-res-por-hoja').innerText = `${porHoja} uds`;
            document.getElementById('top-res-hojas-req').innerText = `${hojasReq} hojas`;

            document.getElementById('top-res-precio-unit').innerText = `$${precioUnit.toFixed(2)}`;
            document.getElementById('top-res-precio-lote').innerText = `$${precioLote.toFixed(2)}`;
            document.getElementById('top-res-ganancia').innerText = `$${ganancia.toFixed(2)}`;

            const escalones = [{ q: 1, d: 0 }, { q: 3, d: 0.05 }, { q: 6, d: 0.10 }, { q: 12, d: 0.15 }, { q: 25, d: 0.20 }];
            let html = '';

            const escalones = [{ q: 1, d: 0 }, { q: 10, d: 0.05 }, { q: 25, d: 0.10 }, { q: 50, d: 0.15 }, { q: 100, d: 0.20 }];

        function toggleModoVinil() {
            const modo = document.getElementById('vin-modo').value;

            const resumenGrid = document.getElementById('vin-resumen-grid');

        function calcularVinil() {
            const modo = document.getElementById('vin-modo').value;
            const cM2 = parseFloat(document.getElementById('vin-costo-m2').value) || 0;
            const mo = parseFloat(document.getElementById('vin-mano-obra').value) || 0;
            const gan = parseFloat(document.getElementById('vin-ganancia').value) || 0;

            let m2 = 0;
            let costoMat = 0;

            if (modo === 'grid') {
                const hojaA = parseFloat(document.getElementById('vin-hoja-ancho').value) || 0;
                const hojaAl = parseFloat(document.getElementById('vin-hoja-alto').value) || 0;
                const pA = parseFloat(document.getElementById('vin-ancho').value) || 0;
                const pAl = parseFloat(document.getElementById('vin-alto').value) || 0;
                const gap = parseFloat(document.getElementById('vin-gap').value) || 0;
                const cant = parseInt(document.getElementById('vin-cantidad').value) || 1;
                const mermaPct = parseFloat(document.getElementById('vin-merma').value) || 0;

                const grid = calcularGrid(hojaA, hojaAl, pA, pAl, gap);
                const porHoja = grid.porHoja > 0 ? grid.porHoja : 1;
                const hojasTeoricas = Math.ceil(cant / porHoja);
                const hojasReq = Math.ceil(hojasTeoricas * (1 + mermaPct / 100));

                // m² totales de las hojas usadas
                m2 = (hojaA * hojaAl / 10000) * hojasReq;

                document.getElementById('vin-res-grid').innerText = `${grid.porFila} × ${grid.porCol}`;
                document.getElementById('vin-res-por-hoja').innerText = `${porHoja} uds`;
                document.getElementById('vin-res-hojas-req').innerText = `${hojasReq} hojas`;
            } else {
                // Modo m² directo: usar el ancho/alto de la pieza como medidas del trabajo
                const a = parseFloat(document.getElementById('vin-ancho').value) || 0;
                const al = parseFloat(document.getElementById('vin-alto').value) || 0;
                m2 = (a * al) / 10000;
            }

            costoMat = m2 * cM2;
            const cTotal = costoMat + mo;
            const precio = cTotal * (1 + gan / 100);

            document.getElementById('vin-res-m2').innerText = `${m2.toFixed(2)} m²`;
            document.getElementById('vin-res-costo-mat').innerText = `$${costoMat.toFixed(2)}`;
            document.getElementById('vin-res-costo-total').innerText = `$${cTotal.toFixed(2)}`;
            document.getElementById('vin-res-precio').innerText = `$${precio.toFixed(2)}`;
        }

            const gan = parseFloat(document.getElementById('vin-ganancia').value) || 40;
            const modo = document.getElementById('vin-modo').value;
            const cant = modo === 'grid' ? (parseInt(document.getElementById('vin-cantidad').value) || 1) : 1;
            switchTab('calculadora');
            agregarRenglonServicio(nombre, cant > 0 ? c / cant : c);
            const fila = document.querySelector('#lista-renglones-presupuesto tr:last-child');
            if (fila) { fila.querySelector('.cant-input').value = cant; fila.querySelector('.ganancia-input').value = gan; recalcularPresupuestoTotal(); }
            mostrarNotificacion("Vinil agregado al presupuesto.");
        }

        function guardarPlantillaCalculadora(tipo) {
            plantillaTipoActual = tipo;
            const nombre = prompt("Nombre de la plantilla:");
            if (!nombre || !nombre.trim()) return;
            const params = capturarParamsCalculadora(tipo);
            db.collection('plantillas').add({ tipo, nombre: nombre.trim(), params: JSON.stringify(params), created_at: new Date().toLocaleString() })
                .then(() => mostrarNotificacion("¡Plantilla guardada!"))
                .catch(() => mostrarNotificacion("Error al guardar plantilla.", "error"));
        }
        function capturarParamsCalculadora(tipo) {
            const ids = {
                forros: ['forr-preset-hoja', 'forr-hoja-ancho', 'forr-hoja-alto', 'forr-preset-cuaderno', 'forr-cuaderno-ancho', 'forr-cuaderno-alto', 'forr-gap', 'forr-cantidad', 'forr-merma', 'forr-costo-vinil', 'forr-costo-laminado', 'forr-costo-tinta', 'forr-costo-bolsa', 'forr-costo-mano', 'forr-costo-depre', 'forr-ganancia'],
                stickers: ['stk-preset-hoja', 'stk-ancho', 'stk-alto', 'stk-gap', 'stk-cantidad', 'stk-merma', 'stk-hoja-ancho', 'stk-hoja-alto', 'stk-costo-hoja', 'stk-costo-laminado', 'stk-costo-tinta', 'stk-costo-cuchilla', 'stk-costo-empaque', 'stk-costo-fijos', 'stk-costo-mano', 'stk-ganancia'],
                papeleria: ['pap-tipo', 'pap-nombre', 'pap-ancho', 'pap-alto', 'pap-gap', 'pap-cantidad', 'pap-merma', 'pap-preset-hoja', 'pap-hoja-ancho', 'pap-hoja-alto', 'pap-costo-material', 'pap-costo-laminado', 'pap-costo-tinta', 'pap-costo-corte', 'pap-costo-empaque', 'pap-costo-fijos', 'pap-horas-diseno', 'pap-tarifa-diseno', 'pap-mano-obra', 'pap-ganancia'],
                toppers: ['top-preset-hoja', 'top-hoja-ancho', 'top-hoja-alto', 'top-ancho', 'top-alto', 'top-gap', 'top-cantidad', 'top-merma', 'top-gastos-pct', 'top-ganancia']
            };
            const out = {};
            (ids[tipo] || []).forEach(id => { const el = document.getElementById(id); if (el) out[id] = el.value; });
            if (tipo === 'stickers') { const chk = document.getElementById('stk-incluir-laminado'); if (chk) out['stk-incluir-laminado'] = chk.checked; }
            if (tipo === 'papeleria') { const chk = document.getElementById('pap-incluir-laminado'); if (chk) out['pap-incluir-laminado'] = chk.checked; }
            if (tipo === 'forros') { const chk = document.getElementById('forr-incluir-bolsa'); if (chk) out['forr-incluir-bolsa'] = chk.checked; }
            return out;
        }
        function aplicarParamsCalculadora(tipo, params) {
            Object.keys(params).forEach(id => {
                const el = document.getElementById(id);
                if (el) { if (el.type === 'checkbox') el.checked = params[id]; else el.value = params[id]; }
            });
            if (tipo === 'forros') calcularForros();
            if (tipo === 'stickers') calcularStickers();
            if (tipo === 'papeleria') calcularPapeleria();
            if (tipo === 'toppers') calcularTopper();
        }
        function abrirModalPlantillas(tipo) {
            plantillaTipoActual = tipo;
            document.getElementById('modal-plantillas').classList.remove('hidden');
            const cont = document.getElementById('contenido-plantillas');
            const filtradas = listaPlantillasDB.filter(p => p.tipo === tipo);
            if (filtradas.length === 0) { cont.innerHTML = '<p class="text-center text-gray-400 py-4">No hay plantillas guardadas para esta calculadora.</p>'; return; }
            cont.innerHTML = '';
            filtradas.forEach(p => {
                const paramsEsc = JSON.stringify(p.params).replace(/"/g, '&quot;');
                cont.innerHTML += `
                    <div class="bg-[#faf8f6] p-2.5 rounded-xl border border-[#e8dbd3] flex justify-between items-center">

                switchTab(tipo === 'stickers' ? 'calc-stickers' : tipo === 'forros' ? 'calc-forros' : tipo === 'papeleria' ? 'calc-papeleria' : 'calc-toppers');

                    html += '</div>';

        async function guardarGasto() {
            const editId = document.getElementById('gasto-edit-id').value;
            const concepto = document.getElementById('gasto-concepto').value.trim();
            const monto = Math.max(0, parseFloat(document.getElementById('gasto-monto').value) || 0);
            const categoria = document.getElementById('gasto-categoria').value;
            if (!concepto || monto <= 0) { mostrarNotificacion("Introduce concepto y monto.", "error"); return; }
            try {
                if (editId) { await db.collection('gastos').doc(editId).update({ concepto, monto, categoria }); mostrarNotificacion("¡Gasto actualizado!"); cancelarEdicionGasto(); }
                else { await db.collection('gastos').add({ concepto, monto, categoria, fechaISO: new Date().toISOString(), fecha: new Date().toLocaleDateString() }); document.getElementById('gasto-concepto').value = ''; document.getElementById('gasto-monto').value = ''; mostrarNotificacion("¡Gasto registrado!"); }

        async function eliminarGasto(id) {
            if (!confirm("¿Eliminar este gasto?")) return;
            try { await db.collection('gastos').doc(id).delete(); cargarGastosYBalance(); mostrarNotificacion("Gasto eliminado."); } catch (e) {}
        }
        async function cargarGastosYBalance() {
            const tbody = document.getElementById('tabla-gastos');
            if (!tbody) return;
            let filtro = document.getElementById('filtro-periodo')?.value || 'este_mes';
            const ahora = new Date(); const mA = ahora.getMonth(); const aA = ahora.getFullYear();
            let gastos = [], ventas = [];
            try {
                const rG = await db.collection('gastos').get(); rG.forEach(d => gastos.push({ id: d.id, ...d.data() }));
                const rV = await db.collection('ventas').get(); rV.forEach(d => ventas.push({ id: d.id, ...d.data() }));
            } catch (e) {}
            const filtrar = (arr) => arr.filter(x => {
                const f = x.fechaISO ? new Date(x.fechaISO) : new Date();
                if (filtro === 'este_mes') return f.getMonth() === mA && f.getFullYear() === aA;
                if (filtro === 'rango') {
                    const d = document.getElementById('filtro-fecha-desde').value;
                    const h = document.getElementById('filtro-fecha-hasta').value;
                    if (!d || !h) return true;
                    const dO = new Date(d), hO = new Date(h); hO.setHours(23, 59, 59, 999);
                    return f >= dO && f <= hO;
                }
                return true;
            });
            const gF = filtrar(gastos), vF = filtrar(ventas);
            let ing = vF.reduce((a, v) => a + (parseFloat(v.total_usd) || 0), 0);
            let egr = gF.reduce((a, g) => a + (parseFloat(g.monto) || 0), 0);
            let util = ing - egr;
            let cO = 0, cI = 0, cM = 0, cOt = 0;
            gF.forEach(g => { const m = parseFloat(g.monto) || 0; if (g.categoria === 'Operativo') cO += m; else if (g.categoria === 'Insumos') cI += m; else if (g.categoria === 'Marketing') cM += m; else cOt += m; });
            const pct = v => egr > 0 ? ((v / egr) * 100).toFixed(0) : 0;
            document.getElementById('cat-operativo-val').innerText = `$${cO.toFixed(2)} (${pct(cO)}%)`;
            document.getElementById('cat-insumos-val').innerText = `$${cI.toFixed(2)} (${pct(cI)}%)`;
            document.getElementById('cat-marketing-val').innerText = `$${cM.toFixed(2)} (${pct(cM)}%)`;
            document.getElementById('cat-otros-val').innerText = `$${cOt.toFixed(2)} (${pct(cOt)}%)`;
            document.getElementById('fin-total-ingresos').innerText = `$${ing.toFixed(2)}`;
            document.getElementById('fin-total-ingresos-ves').innerText = `Bs. ${(ing * tasaBCV).toFixed(2)}`;
            document.getElementById('fin-total-egresos').innerText = `$${egr.toFixed(2)}`;
            document.getElementById('fin-total-egresos-ves').innerText = `Bs. ${(egr * tasaBCV).toFixed(2)}`;
            const uEl = document.getElementById('fin-utilidad-neta');
            const uV = document.getElementById('fin-utilidad-neta-ves');
            uEl.innerText = `$${util.toFixed(2)}`;
            uV.innerText = `Bs. ${(util * tasaBCV).toFixed(2)}`;
            uEl.className = util < 0 ? "text-lg sm:text-xl font-extrabold text-rose-600 mt-1" : "text-lg sm:text-xl font-extrabold text-[#b88a73] mt-1";
            tbody.innerHTML = gF.length ? '' : '<tr><td colspan="5" class="p-3 text-center text-gray-400">Sin egresos.</td></tr>';
            gF.slice().reverse().forEach(g => {
                tbody.innerHTML += `
                    <tr class="border-b border-[#e8dbd3]">
                        <td class="p-2 text-xs text-gray-500">${g.fecha}</td>
                        <td class="p-2 font-semibold text-[#2c2c2c]">${g.concepto}</td>
                        <td class="p-2 text-xs"><span class="bg-[#faf8f6] px-1.5 py-0.5 rounded border border-[#e8dbd3]">${g.categoria}</span></td>
                        <td class="p-2 text-rose-600 font-bold">$${parseFloat(g.monto).toFixed(2)}</td>
                        <td class="p-2 text-center space-x-1 whitespace-nowrap">
                            <button onclick="editarGasto('${g.id}', '${g.concepto.replace(/'/g, "\\'")}', ${g.monto}, '${g.categoria}')" class="bg-gray-100 hover:bg-amber-100 text-amber-700 p-1.5 rounded-xl text-xs"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="eliminarGasto('${g.id}')" class="bg-gray-100 hover:bg-rose-100 text-rose-600 p-1.5 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function agregarItemCajaFila(nombre = '', cant = 1, precio = 0) {
            cajaItemIdx++;
            const tbody = document.getElementById('lista-items-caja');
            if (!tbody) return;
            const rowId = `caja-item-${cajaItemIdx}`;
            const html = `
                <tr id="${rowId}" class="border-b border-[#e8dbd3] caja-item-row relative">
                    <td class="p-1.5 relative">
                        <div class="relative">
                            <input type="text" value="${nombre}" placeholder="Escribe o usa ↑↓ Enter..." class="w-full bg-white border border-[#e8dbd3] rounded-lg px-2 py-1 text-xs caja-search-input font-medium focus:outline-none focus:border-[#b88a73]" autocomplete="off" oninput="guardarBorradorCaja()">
                            <div class="autocomplete-suggestions hidden absolute left-0 right-0 top-full mt-1 bg-white border border-[#e8dbd3] rounded-xl shadow-lg max-h-40 overflow-y-auto z-50"></div>

                    </td>
                    <td class="p-1.5 text-center"><input type="number" value="${cant}" min="1" class="w-full bg-white border border-[#e8dbd3] rounded-lg px-1 py-1 text-xs text-center caja-cant-input font-medium" oninput="recalcularTotalesCaja(); guardarBorradorCaja();"></td>
                    <td class="p-1.5 text-right"><input type="number" step="0.01" min="0" value="${parseFloat(precio).toFixed(2)}" class="w-full bg-white border border-[#e8dbd3] rounded-lg px-2 py-1 text-xs text-right caja-precio-input font-bold text-[#b88a73]" oninput="recalcularTotalesCaja(); guardarBorradorCaja();"></td>
                    <td class="p-1.5 text-center whitespace-nowrap">
                        <button onclick="editarItemCajaFila('${rowId}')" class="bg-gray-100 hover:bg-amber-100 text-amber-700 p-1 rounded text-xs mr-0.5"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="document.getElementById('${rowId}').remove(); recalcularTotalesCaja(); guardarBorradorCaja();" class="bg-gray-100 hover:bg-rose-100 text-rose-600 p-1 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>`;
            tbody.insertAdjacentHTML('beforeend', html);
            const row = document.getElementById(rowId);
            const inputEl = row.querySelector('.caja-search-input');
            const sugBox = row.querySelector('.autocomplete-suggestions');
            let focusIdx = -1;
            inputEl.addEventListener('input', function() {
                const q = this.value.toLowerCase().trim();
                let matches = [];
                focusIdx = -1;
                if (q.length > 0) {
                    listaInsumosDB.forEach(i => { if (i.nombre.toLowerCase().includes(q)) matches.push({ tipo: 'Insumo', nombre: i.nombre, precio: (parseFloat(i.costo_unitario) * 1.5).toFixed(2) }); });
                    listaServiciosDB.forEach(s => { if (s.nombre.toLowerCase().includes(q)) matches.push({ tipo: 'Servicio', nombre: s.nombre, precio: parseFloat(s.precio).toFixed(2) }); });
                }
                if (matches.length) {
                    sugBox.innerHTML = '';
                    sugBox.classList.remove('hidden');
                    matches.forEach(m => {
                        const bc = m.tipo === 'Insumo' ? 'bg-[#b88a73] text-white' : 'bg-slate-700 text-white';
                        const d = document.createElement('div');
                        d.className = 'px-3 py-1.5 text-xs hover:bg-[#faf8f6] cursor-pointer flex justify-between items-center border-b border-gray-100 last:border-none';
                        d.innerHTML = `<span class="font-medium text-gray-800">${m.nombre}</span><div class="space-x-2"><span class="text-[9px] px-1.5 py-0.5 rounded ${bc}">${m.tipo}</span><span class="font-bold text-[#b88a73]">$${m.precio}</span></div>`;
                        d.onclick = () => { inputEl.value = m.nombre; row.querySelector('.caja-precio-input').value = m.precio; sugBox.classList.add('hidden'); recalcularTotalesCaja(); guardarBorradorCaja(); };
                        sugBox.appendChild(d);
                    });
                } else sugBox.classList.add('hidden');
            });
            inputEl.addEventListener('keydown', function(e) {
                const items = sugBox.querySelectorAll('div');
                if (!items.length) return;
                if (e.key === 'ArrowDown') { focusIdx++; if (focusIdx >= items.length) focusIdx = 0; upd(items); e.preventDefault(); }
                else if (e.key === 'ArrowUp') { focusIdx--; if (focusIdx < 0) focusIdx = items.length - 1; upd(items); e.preventDefault(); }
                else if (e.key === 'Enter') { e.preventDefault(); if (focusIdx > -1 && items[focusIdx]) items[focusIdx].click(); else if (items.length) items[0].click(); }
            });
            function upd(items) { items.forEach((it, i) => { if (i === focusIdx) { it.classList.add('autocomplete-active'); it.scrollIntoView({ block: 'nearest' }); } else it.classList.remove('autocomplete-active'); }); }
            inputEl.focus();
            recalcularTotalesCaja();
            guardarBorradorCaja();
        }

        function guardarBorradorCaja() {
            const items = [];
            document.querySelectorAll('.caja-item-row').forEach(row => { items.push({ desc: row.querySelector('.caja-search-input').value, cant: row.querySelector('.caja-cant-input').value, precio: row.querySelector('.caja-precio-input').value }); });
            localStorage.setItem('lan_borrador_caja', JSON.stringify(items));
        }
        function recalcularTotalesCaja() {
            let sub = 0;
            document.querySelectorAll('.caja-item-row').forEach(row => {
                const c = parseFloat(row.querySelector('.caja-cant-input').value) || 0;
                const p = parseFloat(row.querySelector('.caja-precio-input').value) || 0;
                sub += c * p;
            });
            const desc = parseFloat(document.getElementById('caja-descuento-pct').value) || 0;
            const total = Math.max(0, sub - (sub * desc / 100));
            const elT = document.getElementById('caja-total-usd');
            const elV = document.getElementById('caja-total-ves');
            if (elT) elT.value = total.toFixed(2);
            if (elV) elV.value = `Bs. ${(total * tasaBCV).toFixed(2)}`;
            const rT = document.getElementById('resumen-total'); if (rT) rT.innerText = `$${total.toFixed(2)}`;
            const rTV = document.getElementById('resumen-total-ves'); if (rTV) rTV.innerText = `Bs. ${(total * tasaBCV).toFixed(2)}`;
            calcularRestanteCaja();
        }

        function calcularRestanteCaja() {
            const total = parseFloat(document.getElementById('caja-total-usd').value) || 0;
            let ab = 0;
            document.querySelectorAll('.pago-item .monto-pago').forEach(i => ab += parseFloat(i.value) || 0);

            document.getElementById('resumen-abonado-ves').innerText = `Bs. ${(ab * tasaBCV).toFixed(2)}`;
            const r = total - ab;
            const el = document.getElementById('resumen-restante');
            const elV = document.getElementById('resumen-restante-ves');
            if (r > 0) { el.innerText = `Falta: $${r.toFixed(2)}`; el.className = "font-bold text-rose-600 text-xs block"; elV.innerText = `Bs. ${(r * tasaBCV).toFixed(2)}`; }
            else if (r < 0) { el.innerText = `Vuelto: $${Math.abs(r).toFixed(2)}`; el.className = "font-bold text-emerald-600 text-xs block"; elV.innerText = `Bs. ${(Math.abs(r) * tasaBCV).toFixed(2)}`; }
            else { el.innerText = "Pagado Exacto"; el.className = "font-bold text-emerald-600 text-xs block"; elV.innerText = "Bs. 0.00"; }

        async function procesarPagoFinal() {
            const cliente = document.getElementById('caja-cliente').value;
            const totalUSD = parseFloat(document.getElementById('caja-total-usd').value) || 0;
            const notas = document.getElementById('caja-notas').value.trim();
            const descuento = document.getElementById('caja-descuento-pct').value || '0';
            if (totalUSD <= 0) { mostrarNotificacion("Factura vacía.", "error"); return; }
            let items = [];
            document.querySelectorAll('.caja-item-row').forEach(row => {
                const d = row.querySelector('.caja-search-input').value.trim();
                const c = parseInt(row.querySelector('.caja-cant-input').value) || 1;
                const p = parseFloat(row.querySelector('.caja-precio-input').value) || 0;
                if (d) items.push({ desc: d, cant: c, precio: p });
            });
            if (!items.length) { mostrarNotificacion("Añade al menos un ítem.", "error"); return; }
            let metodos = [], totalAb = 0;
            document.querySelectorAll('.pago-item').forEach(it => {
                const m = it.querySelector('select').value;
                const mo = parseFloat(it.querySelector('.monto-pago').value) || 0;
                const r = it.querySelector('.ref-pago').value || 'S/R';
                if (mo > 0) { metodos.push(`${m}: $${mo.toFixed(2)} (Ref: ${r})`); totalAb += mo; }
            });
            if (totalAb < totalUSD) { if (!confirm(`Pago incompleto. Faltan $${(totalUSD - totalAb).toFixed(2)}. ¿Procesar igual?`)) return; }
            const concepto = items.map(i => `${i.cant}x ${i.desc}`).join(' + ');
            const metodosStr = metodos.join(' | ') || 'No especificado';
            try {
                await db.collection('ventas').add({ fechaISO: new Date().toISOString(), fecha: new Date().toLocaleDateString(), cliente, concepto, total_usd: totalUSD, metodos_pago: metodosStr, descuento: `${descuento}%`, notas });
                ultimaVentaProcesada = { cliente, concepto, total_usd: totalUSD, metodos_pago: metodosStr, notas };
            } catch (e) { mostrarNotificacion("Error al guardar venta.", "error"); return; }
            mostrarNotificacion("¡Venta procesada!");
            localStorage.removeItem('lan_borrador_caja');
            document.getElementById('lista-items-caja').innerHTML = '';
            document.getElementById('lista-pagos').innerHTML = '';
            document.getElementById('caja-notas').value = '';
            document.getElementById('caja-descuento-pct').value = '0';
            agregarItemCajaFila('Servicio de Diseño e Impresión', 1, 0);
            recalcularTotalesCaja();
            switchTab('dashboard');
            cargarDashboard();
        }

                const hoyStr = new Date().toLocaleDateString();

                let ventasHoy = [];
                snap.forEach(d => { const v = d.data(); const f = v.fecha || new Date(v.fechaISO).toLocaleDateString(); if (f === hoyStr) ventasHoy.push(v); });
                let total = 0, desglose = {};
                ventasHoy.forEach(v => {
                    total += parseFloat(v.total_usd) || 0;
                    const p = (v.metodos_pago || '').split('|');
                    p.forEach(x => {
                        const s = x.split(':');
                        if (s.length >= 2) {
                            const mn = s[0].trim();
                            const mm = s[1].match(/\$([0-9.]+)/);
                            if (mm) desglose[mn] = (desglose[mn] || 0) + parseFloat(mm[1]);
                        }
                    });
                });
                let htmlMet = '';
                for (let m in desglose) htmlMet += `<div class="flex justify-between py-1 border-b border-gray-100"><span>${m}:</span><span class="font-bold text-[#b88a73]">$${desglose[m].toFixed(2)} (Bs. ${(desglose[m] * tasaBCV).toFixed(2)})</span></div>`;
                if (!htmlMet) htmlMet = '<p class="text-gray-400 text-center py-2">Sin detalles para hoy.</p>';
                cont.innerHTML = `
                    <div class="bg-[#faf8f6] p-3 rounded-xl border border-[#e8dbd3] space-y-2">
                        <div class="flex justify-between font-bold text-xs border-b pb-1.5"><span>Fecha:</span><span>${hoyStr}</span></div>
                        <div><p class="text-[10px] font-semibold text-gray-500 uppercase">Métodos:</p><div class="mt-1.5 space-y-1">${htmlMet}</div></div>
                        <div class="flex justify-between font-extrabold text-sm text-[#b88a73] border-t pt-1.5 mt-1.5"><span>Total Hoy:</span><span>$${total.toFixed(2)} <span class="text-[10px] block text-gray-500 font-normal">Bs. ${(total * tasaBCV).toFixed(2)}</span></span></div>
                    </div>`;
            } catch (e) { cont.innerHTML = '<p class="text-center text-rose-500">Error.</p>'; }
        }

        async function guardarPresupuestoStandBy() {
            const cliente = document.getElementById('presupuesto-cliente').value;
            const validez = document.getElementById('presupuesto-validez').value;
            const totalUSD = parseFloat(document.getElementById('doc-total-usd').innerText.replace('$', '')) || 0;
            if (totalUSD <= 0) { mostrarNotificacion("Cotización vacía.", "error"); return; }
            const items = [];
            document.querySelectorAll('.renglon-item').forEach(row => {
                const desc = row.querySelector('.desc-input').value;
                const cant = parseFloat(row.querySelector('.cant-input').value) || 1;
                const precio = parseFloat(row.querySelector('.precio-cliente-input').value) || 0;
                if (desc) items.push({ desc, cant, precio });
            });
            const btn = document.getElementById('btn-guardar-standby');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Guardando...';
            try {
                await db.collection('standby').add({ cliente, validez, total_usd: totalUSD, items: JSON.stringify(items), created_at: new Date().toLocaleString() });
                mostrarNotificacion("¡Guardado en Stand By!");
                cargarCotizacionesStandBy();
                switchTab('standby');
            } catch (e) { mostrarNotificacion("Error.", "error"); }
            finally { if (btn) btn.innerHTML = '<i class="fa-solid fa-clock"></i><span>Guardar en Stand By</span>'; }

            try {
                const snap = await db.collection('standby').get();
                let regs = []; snap.forEach(d => regs.push({ id: d.id, ...d.data() }));
                tbody.innerHTML = regs.length ? '' : '<tr><td colspan="5" class="p-4 text-center text-gray-400">No hay cotizaciones.</td></tr>';
                regs.forEach(cot => {
                    let resumen = cot.items;
                    try { const p = JSON.parse(cot.items); if (Array.isArray(p)) resumen = p.map(i => `${i.cant}x ${i.desc}`).join(', '); } catch (e) {}
                    const j = JSON.stringify(cot).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                    tbody.innerHTML += `

        function recalcularPresupuestoTotal() {
            let tc = 0, tv = 0;
            document.querySelectorAll('.renglon-item').forEach(r => {
                const c = parseFloat(r.querySelector('.cant-input').value) || 0;
                const cu = parseFloat(r.querySelector('.costo-input').value) || 0;
                const g = parseFloat(r.querySelector('.ganancia-input').value) || 0;
                const m = r.querySelector('.precio-cliente-input');
                const cf = c * cu;
                tc += cf;
                const ps = cf * (1 + g / 100);
                if (!m.classList.contains('modificado-manual')) { m.value = ps.toFixed(2); tv += ps; }
                else tv += parseFloat(m.value) || 0;
            });
            const gn = tv - tc;
            document.getElementById('doc-subtotal-costo').innerText = tc.toFixed(2);
            document.getElementById('doc-total-ganancia').innerText = gn.toFixed(2);
            document.getElementById('doc-total-usd').innerText = `$${tv.toFixed(2)}`;
            document.getElementById('doc-total-ves').innerText = `Bs. ${(tv * tasaBCV).toFixed(2)}`;
            const sel = document.getElementById('presupuesto-cliente').value;
            document.getElementById('doc-cliente-nombre').innerText = sel === 'CREAR_NUEVO_CLIENTE' ? 'Cliente General' : sel;
            document.getElementById('doc-validez-txt').innerText = document.getElementById('presupuesto-validez').value || 'N/A';
        }

            localStorage.setItem('lan_borrador_presupuesto', JSON.stringify(items));

        // ================== DASHBOARD ==================
        async function cargarDashboard() {
            let ventas = [], insumos = [], clientes = [];
            try {
                const rV = await db.collection('ventas').get(); rV.forEach(d => ventas.push(d.data()));
                const rI = await db.collection('insumos').get(); rI.forEach(d => insumos.push(d.data()));
                const rC = await db.collection('clientes').get(); rC.forEach(d => clientes.push(d.data()));
            } catch (e) {}
            let tv = ventas.reduce((a, v) => a + (parseFloat(v.total_usd) || 0), 0);
            let ia = insumos.filter(i => parseInt(i.stock || 0) <= parseInt(i.stock_minimo || 0)).length;
            document.getElementById('dash-ventas').innerHTML = `$${tv.toFixed(2)} <span class="block text-[10px] font-normal text-gray-500">Bs. ${(tv * tasaBCV).toFixed(2)}</span>`;
            document.getElementById('dash-insumos').innerText = insumos.length;
            document.getElementById('dash-insumos-alerta').innerText = ia;
            document.getElementById('dash-clientes').innerText = clientes.length;
            cargarRegistrosCajaEditable();
        }

        // ================== LOGO ==================
        async function actualizarLogo() {
            const fi = document.getElementById('logo-file-input');
            if (fi && fi.files && fi.files[0]) {
                const r = new FileReader();
                r.onload = async (e) => {
                    try { await db.collection('config').doc('logo').set({ imagen: e.target.result }); aplicarLogoEnUI(e.target.result); mostrarNotificacion("¡Logo sincronizado!"); }
                    catch (er) { mostrarNotificacion("Error al guardar logo.", "error"); }
                };
                r.readAsDataURL(fi.files[0]);
            } else mostrarNotificacion("Selecciona una imagen.", "error");
        }
        async function cargarLogoCloud() {
            try { const d = await db.collection('config').doc('logo').get(); if (d.exists && d.data().imagen) aplicarLogoEnUI(d.data().imagen); } catch (e) {}
        }
        function aplicarLogoEnUI(src) {
            const h = `<img src="${src}" class="w-full h-full object-cover rounded-xl">`;
            const c1 = document.getElementById('logo-container'); if (c1) c1.innerHTML = h;
            const c2 = document.getElementById('doc-logo-preview'); if (c2) c2.innerHTML = h;
        }

        // ================== INIT / AUTH STATE ==================
        auth.onAuthStateChanged(async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appContent = document.getElementById('app-content');

            if (user) {
                usuarioActual = user;
                if (loginScreen) loginScreen.classList.add('hidden');
                if (appContent) appContent.classList.remove('hidden');

                const disp = document.getElementById('user-display');
                if (disp) disp.innerText = user.email ? user.email.split('@')[0] : 'Usuario';

                iniciarListenersTiempoReal();
                await fetchBCVRate();
                await cargarLogoCloud();

                const b = localStorage.getItem('lan_borrador_presupuesto');
                const tb = document.getElementById('lista-renglones-presupuesto');
                if (tb && tb.children.length === 0) {
                    if (b) {
                        try {
                            const p = JSON.parse(b);
                            if (Array.isArray(p) && p.length) {
                                tb.innerHTML = '';
                                p.forEach(i => {
                                    agregarRenglonServicio(i.desc, i.costo);
                                    const f = tb.lastElementChild;
                                    if (f) { f.querySelector('.cant-input').value = i.cant; f.querySelector('.ganancia-input').value = i.ganancia; f.querySelector('.precio-cliente-input').value = i.precio; f.querySelector('.precio-cliente-input').classList.add('modificado-manual'); }
                                });
                                recalcularPresupuestoTotal();
                            } else agregarRenglonServicio('Diseño e Impresión', 0);
                        } catch (e) { agregarRenglonServicio('Diseño e Impresión', 0); }
                    } else agregarRenglonServicio('Diseño e Impresión', 0);
                }

                syncRoute();
            } else {
                usuarioActual = null;
                if (loginScreen) loginScreen.classList.remove('hidden');
                if (appContent) appContent.classList.add('hidden');
                const pe = document.getElementById('login-password'); if (pe) pe.value = '';
                const le = document.getElementById('login-email'); if (le && !le.value) le.focus();
            }
        });
