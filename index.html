<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasa BCV y Fecha/Hora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .title {
      font-size: 1.2rem;
      color: #333333;
      margin-bottom: 20px;
      font-weight: 600;
    }
    .bcv-box {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .bcv-label {
      font-size: 0.85rem;
      color: #4f46e5;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .bcv-value {
      font-size: 2.2rem;
      font-weight: bold;
      color: #1e1b4b;
      margin-top: 5px;
    }
    .time-box {
      font-size: 0.95rem;
      color: #555555;
      border-top: 1px solid #eeeeee;
      padding-top: 15px;
    }
    .time-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #222222;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Información BCV en Tiempo Real</div>
    
    <div class="bcv-box">
      <div class="bcv-label">Tasa Oficial BCV</div>
      <div class="bcv-value" id="tasa-bcv">Cargando...</div>
    </div>

    <div class="time-box">
      <div>Fecha y Hora:</div>
      <div class="time-value" id="fecha-hora">--/--/---- --:--:-- --</div>
    </div>
  </div>

  <script>
    // 1. Función para actualizar fecha y hora en formato 12 horas (AM/PM)
    function actualizarFechaHora() {
      const ahora = new Date();
      
      const opciones = {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      };

      const fechaHoraFormateada = ahora.toLocaleString('es-VE', opciones);
      document.getElementById('fecha-hora').textContent = fechaHoraFormateada;
    }

    // 2. Función para obtener la tasa del BCV mediante la API pública
    async function obtenerTasaBCV() {
      const elementoTasa = document.getElementById('tasa-bcv');
      try {
        const respuesta = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
        if (!respuesta.ok) throw new Error('Error al conectar con la API');
        
        const datos = await respuesta.json();
        const promedio = datos.promedio;
        
        elementoTasa.textContent = `Bs. ${promedio.toFixed(2)}`;
      } catch (error) {
        console.error('Error al obtener la tasa BCV:', error);
        elementoTasa.textContent = 'Error de carga';
      }
    }

    // Actualiza el reloj cada segundo
    setInterval(actualizarFechaHora, 1000);
    actualizarFechaHora();

    // Consulta la tasa del día al cargar la página
    obtenerTasaBCV();

    // Reconsulta la tasa automáticamente cada 30 minutos
    setInterval(obtenerTasaBCV, 30 * 60 * 1000);
  </script>

</body>
</html>
