<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Costos, Cotizaciones y Facturación</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        .btn-warning { background: var(--warning); color: #fff; }
        .btn-warning:hover { background: #d97706; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background: #f9fafb;
            font-weight: 600;
            color: var(--text-muted);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pendiente { background: #fef3c7; color: #d97706; }
        .badge-concretado { background: #d1fae5; color: #059669; }
        .badge-anulado { background: #fee2e2; color: #dc2626; }

        .actions-cell {
            display: flex;
            gap: 5px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Gestión de Negocio - Cotizaciones & Facturación</h1>
        <div id="reloj" style="font-weight: 600; color: var(--text-muted);"></div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('cotizador')">Nueva Cotización</button>
        <button class="tab-btn" onclick="switchTab('standby')">Cotizaciones Stand By (<span id="count-standby">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('facturadas')">Ventas Facturadas</button>
    </div>

    <!-- TAB 1: NUEVA COTIZACIÓN -->
    <div id="cotizador" class="tab-content active">
        <div class="card">
            <h2>Crear Cotización o Presupuesto</h2>
            <form id="form-cotizacion" onsubmit="guardarCotizacion(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Cliente</label>
                        <input type="text" id="cliente" required placeholder="Nombre y Apellido">
                    </div>
                    <div class="form-group">
                        <label>Teléfono / Contacto</label>
                        <input type="text" id="telefono" required placeholder="Ej: 0412-1234567">
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="fecha" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Detalle de Productos / Servicios (Zapatos, Toppers, Stickers, etc.)</label>
                    <textarea id="detalle" rows="3" required placeholder="Describa los artículos cotizados..."></textarea>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Total ($)</label>
                        <input type="number" step="0.01" id="total" required placeholder="0.00">
                    </div>
                </div>
                <button type="submit" class="btn">Guardar en Stand By</button>
            </form>
        </div>
    </div>

    <!-- TAB 2: STAND BY -->
    <div id="standby" class="tab-content">
        <div class="card">
            <h2>Cotizaciones en Espera (Stand By)</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
                            <th>Contacto</th>
                            <th>Detalle</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-standby">
                        <!-- Inyectado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB 3: FACTURADAS -->
    <div id="facturadas" class="tab-content">
        <div class="card">
            <h2>Historial de Ventas Facturadas</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Fecha Concreción</th>
                            <th>Cliente</th>
                            <th>Detalle</th>
                            <th>Total ($)</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-facturadas">
                        <!-- Inyectado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // Base de datos local simulada
    let cotizaciones = JSON.parse(localStorage.getItem('cotizaciones_negocio')) || [
        { id: 'COT-001', fecha: '2026-09-10', cliente: 'María Pérez', telefono: '0412-1234567', detalle: '2 pares de zapatos deportivos', total: 45.00, estado: 'Pendiente' },
        { id: 'COT-002', fecha: '2026-09-10', cliente: 'Carlos Gómez', telefono: '0414-9876543', detalle: 'Toppers personalizados (Pack x5)', total: 12.50, estado: 'Concretado' }
    ];

    document.getElementById('fecha').valueAsDate = new Date();

    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function guardarCotizacion(e) {
        e.preventDefault();
        const nueva = {
            id: 'COT-' + String(cotizaciones.length + 1).padStart(3, '0'),
            fecha: document.getElementById('fecha').value,
            cliente: document.getElementById('cliente').value,
            telefono: document.getElementById('telefono').value,
            detalle: document.getElementById('detalle').value,
            total: parseFloat(document.getElementById('total').value),
            estado: 'Pendiente'
        };

        cotizaciones.push(nueva);
        sincronizar();
        document.getElementById('form-cotizacion').reset();
        document.getElementById('fecha').valueAsDate = new Date();
        alert('Cotización guardada exitosamente en Stand By.');
        switchTab('standby');
        document.querySelector('.tabs button:nth-child(2)').classList.add('active');
        document.querySelector('.tabs button:nth-child(1)').classList.remove('active');
    }

    function cambiarEstado(id, nuevoEstado) {
        const item = cotizaciones.find(c => c.id === id);
        if (item) {
            item.estado = nuevoEstado;
            sincronizar();
        }
    }

    function sincronizar() {
        localStorage.setItem('cotizaciones_negocio', JSON.stringify(cotizaciones));
        renderTablas();
    }

    function renderTablas() {
        const tbodyStandBy = document.getElementById('tabla-standby');
        const tbodyFacturadas = document.getElementById('tabla-facturadas');
        
        tbodyStandBy.innerHTML = '';
        tbodyFacturadas.innerHTML = '';

        let countStandBy = 0;

        cotizaciones.forEach(c => {
            if (c.estado === 'Pendiente') {
                countStandBy++;
                tbodyStandBy.innerHTML += `
                    <tr>
                        <td><b>${c.id}</b></td>
                        <td>${c.fecha}</td>
                        <td>${c.cliente}</td>
                        <td>${c.telefono}</td>
                        <td>${c.detalle}</td>
                        <td>$${c.total.toFixed(2)}</td>
                        <td>
                            <div class="actions-cell">
                                <button class="btn btn-success btn-sm" onclick="cambiarEstado('${c.id}', 'Concretado')">Facturar</button>
                                <button class="btn btn-warning btn-sm" onclick="cambiarEstado('${c.id}', 'Anulado')">Anular</button>
                            </div>
                        </td>
                    </tr>
                `;
            } else if (c.estado === 'Concretado') {
                tbodyFacturadas.innerHTML += `
                    <tr>
                        <td><b>${c.id}</b></td>
                        <td>${c.fecha}</td>
                        <td>${c.cliente}</td>
                        <td>${c.detalle}</td>
                        <td>$${c.total.toFixed(2)}</td>
                        <td><span class="badge badge-concretado">Facturado</span></td>
                    </tr>
                `;
            }
        });

        document.getElementById('count-standby').innerText = countStandBy;
        if (countStandBy === 0) {
            tbodyStandBy.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No hay cotizaciones en Stand By.</td></tr>`;
        }
    }

    renderTablas();
</script>

</body>
</html>
