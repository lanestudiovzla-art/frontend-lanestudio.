<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN ESTUDIO - Sistema de Gestión</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tab-content.active {
            display: block;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-edit { background-color: #f59e0b; color: white; margin-right: 5px; }
        .btn-edit:hover { background-color: #d97706; }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .actions-cell {
            display: flex;
            gap: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>LAN ESTUDIO - Sistema de Gestión</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'insumos')">Insumos</button>
        <button class="tab-btn" onclick="switchTab(event, 'calculadora')">Calculadora (Toppers/Stickers)</button>
        <button class="tab-btn" onclick="switchTab(event, 'cotizador')">Cotizador</button>
        <button class="tab-btn" onclick="switchTab(event, 'factura')">Factura</button>
    </div>

    <!-- PESTAÑA INSUMOS -->
    <div id="insumos" class="tab-content active">
        <h2>Gestión de Insumos</h2>
        <form id="form-insumo" onsubmit="guardarInsumo(event)">
            <input type="hidden" id="insumo-index" value="">
            <div class="form-group">
                <label>Nombre del Insumo</label>
                <input type="text" id="nombre-insumo" required>
            </div>
            <div class="form-group">
                <label>Costo Unitario ($)</label>
                <input type="number" step="0.01" id="costo-insumo" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-guardar-insumo">Guardar Insumo</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Insumo</th>
                    <th>Costo ($)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-insumos-body">
                <!-- Dinámico -->
            </tbody>
        </table>
    </div>

    <!-- PESTAÑA CALCULADORA -->
    <div id="calculadora" class="tab-content">
        <h2>Calculadora de Producción (Toppers / Stickers)</h2>
        <form id="form-calc" onsubmit="guardarCalculo(event)">
            <input type="hidden" id="calc-index" value="">
            <div class="form-group">
                <label>Tipo de Producto</label>
                <select id="calc-tipo">
                    <option value="Topper">Topper</option>
                    <option value="Sticker">Sticker</option>
                </select>
            </div>
            <div class="form-group">
                <label>Descripción / Detalle</label>
                <input type="text" id="calc-desc" required>
            </div>
            <div class="form-group">
                <label>Costo Total Calculado ($)</label>
                <input type="number" step="0.01" id="calc-costo" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-guardar-calc">Guardar Registro</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Costo ($)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-calc-body">
                <!-- Dinámico -->
            </tbody>
        </table>
    </div>

    <!-- PESTAÑA COTIZADOR -->
    <div id="cotizador" class="tab-content">
        <h2>Cotizaciones</h2>
        <form id="form-cotizador" onsubmit="guardarCotizacion(event)">
            <input type="hidden" id="cot-index" value="">
            <div class="form-group">
                <label>Cliente</label>
                <input type="text" id="cot-cliente" required>
            </div>
            <div class="form-group">
                <label>Detalle de la Cotización</label>
                <input type="text" id="cot-detalle" required>
            </div>
            <div class="form-group">
                <label>Monto Total ($)</label>
                <input type="number" step="0.01" id="cot-monto" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-guardar-cot">Guardar Cotización</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Detalle</th>
                    <th>Total ($)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-cot-body">
                <!-- Dinámico -->
            </tbody>
        </table>
    </div>

    <!-- PESTAÑA FACTURA -->
    <div id="factura" class="tab-content">
        <h2>Control de Facturas</h2>
        <form id="form-factura" onsubmit="guardarFactura(event)">
            <input type="hidden" id="fac-index" value="">
            <div class="form-group">
                <label>Nº de Factura</label>
                <input type="text" id="fac-numero" required>
            </div>
            <div class="form-group">
                <label>Cliente</label>
                <input type="text" id="fac-cliente" required>
            </div>
            <div class="form-group">
                <label>Monto ($)</label>
                <input type="number" step="0.01" id="fac-monto" required>
            </div>
            <button type="submit" class="btn-primary" id="btn-guardar-fac">Guardar Factura</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Nº Factura</th>
                    <th>Cliente</th>
                    <th>Monto ($)</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-fac-body">
                <!-- Dinámico -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Estructuras de datos locales simuladas
    let insumos = [];
    let calculos = [];
    let cotizaciones = [];
    let facturas = [];

    function switchTab(evt, tabName) {
        let contents = document.getElementsByClassName("tab-content");
        for (let c of contents) c.classList.remove("active");

        let buttons = document.getElementsByClassName("tab-btn");
        for (let b of buttons) b.classList.remove("active");

        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }

    // --- CRUD INSUMOS ---
    function guardarInsumo(e) {
        e.preventDefault();
        const index = document.getElementById('insumo-index').value;
        const nombre = document.getElementById('nombre-insumo').value;
        const costo = document.getElementById('costo-insumo').value;

        if (index === "") {
            insumos.push({ nombre, costo });
        } else {
            insumos[index] = { nombre, costo };
            document.getElementById('insumo-index').value = "";
            document.getElementById('btn-guardar-insumo').innerText = "Guardar Insumo";
        }
        document.getElementById('form-insumo').reset();
        renderInsumos();
    }

    function renderInsumos() {
        const tbody = document.getElementById('tabla-insumos-body');
        tbody.innerHTML = "";
        insumos.forEach((item, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.nombre}</td>
                    <td>$${parseFloat(item.costo).toFixed(2)}</td>
                    <td class="actions-cell">
                        <button class="btn-edit" onclick="editarInsumo(${idx})">Editar</button>
                        <button class="btn-danger" onclick="eliminarInsumo(${idx})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    }

    function editarInsumo(idx) {
        document.getElementById('insumo-index').value = idx;
        document.getElementById('nombre-insumo').value = insumos[idx].nombre;
        document.getElementById('costo-insumo').value = insumos[idx].costo;
        document.getElementById('btn-guardar-insumo').innerText = "Actualizar Insumo";
    }

    function eliminarInsumo(idx) {
        insumos.splice(idx, 1);
        renderInsumos();
    }

    // --- CRUD CALCULADORA ---
    function guardarCalculo(e) {
        e.preventDefault();
        const index = document.getElementById('calc-index').value;
        const tipo = document.getElementById('calc-tipo').value;
        const desc = document.getElementById('calc-desc').value;
        const costo = document.getElementById('calc-costo').value;

        if (index === "") {
            calculos.push({ tipo, desc, costo });
        } else {
            calculos[index] = { tipo, desc, costo };
            document.getElementById('calc-index').value = "";
            document.getElementById('btn-guardar-calc').innerText = "Guardar Registro";
        }
        document.getElementById('form-calc').reset();
        renderCalculos();
    }

    function renderCalculos() {
        const tbody = document.getElementById('tabla-calc-body');
        tbody.innerHTML = "";
        calculos.forEach((item, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.tipo}</td>
                    <td>${item.desc}</td>
                    <td>$${parseFloat(item.costo).toFixed(2)}</td>
                    <td class="actions-cell">
                        <button class="btn-edit" onclick="editarCalculo(${idx})">Editar</button>
                        <button class="btn-danger" onclick="eliminarCalculo(${idx})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    }

    function editarCalculo(idx) {
        document.getElementById('calc-index').value = idx;
        document.getElementById('calc-tipo').value = calculos[idx].tipo;
        document.getElementById('calc-desc').value = calculos[idx].desc;
        document.getElementById('calc-costo').value = calculos[idx].costo;
        document.getElementById('btn-guardar-calc').innerText = "Actualizar Registro";
    }

    function eliminarCalculo(idx) {
        calculos.splice(idx, 1);
        renderCalculos();
    }

    // --- CRUD COTIZADOR ---
    function guardarCotizacion(e) {
        e.preventDefault();
        const index = document.getElementById('cot-index').value;
        const cliente = document.getElementById('cot-cliente').value;
        const detalle = document.getElementById('cot-detalle').value;
        const monto = document.getElementById('cot-monto').value;

        if (index === "") {
            cotizaciones.push({ cliente, detalle, monto });
        } else {
            cotizaciones[index] = { cliente, detalle, monto };
            document.getElementById('cot-index').value = "";
            document.getElementById('btn-guardar-cot').innerText = "Guardar Cotización";
        }
        document.getElementById('form-cotizador').reset();
        renderCotizaciones();
    }

    function renderCotizaciones() {
        const tbody = document.getElementById('tabla-cot-body');
        tbody.innerHTML = "";
        cotizaciones.forEach((item, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.cliente}</td>
                    <td>${item.detalle}</td>
                    <td>$${parseFloat(item.monto).toFixed(2)}</td>
                    <td class="actions-cell">
                        <button class="btn-edit" onclick="editarCotizacion(${idx})">Editar</button>
                        <button class="btn-danger" onclick="eliminarCotizacion(${idx})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    }

    function editarCotizacion(idx) {
        document.getElementById('cot-index').value = idx;
        document.getElementById('cot-cliente').value = cotizaciones[idx].cliente;
        document.getElementById('cot-detalle').value = cotizaciones[idx].detalle;
        document.getElementById('cot-monto').value = cotizaciones[idx].monto;
        document.getElementById('btn-guardar-cot').innerText = "Actualizar Cotización";
    }

    function eliminarCotizacion(idx) {
        cotizaciones.splice(idx, 1);
        renderCotizaciones();
    }

    // --- CRUD FACTURA ---
    function guardarFactura(e) {
        e.preventDefault();
        const index = document.getElementById('fac-index').value;
        const numero = document.getElementById('fac-numero').value;
        const cliente = document.getElementById('fac-cliente').value;
        const monto = document.getElementById('fac-monto').value;

        if (index === "") {
            facturas.push({ numero, cliente, monto });
        } else {
            facturas[index] = { numero, cliente, monto };
            document.getElementById('fac-index').value = "";
            document.getElementById('btn-guardar-fac').innerText = "Guardar Factura";
        }
        document.getElementById('form-factura').reset();
        renderFacturas();
    }

    function renderFacturas() {
        const tbody = document.getElementById('tabla-fac-body');
        tbody.innerHTML = "";
        facturas.forEach((item, idx) => {
            tbody.innerHTML += `
                <tr>
                    <td>${item.numero}</td>
                    <td>${item.cliente}</td>
                    <td>$${parseFloat(item.monto).toFixed(2)}</td>
                    <td class="actions-cell">
                        <button class="btn-edit" onclick="editarFactura(${idx})">Editar</button>
                        <button class="btn-danger" onclick="eliminarFactura(${idx})">Eliminar</button>
                    </td>
                </tr>
            `;
        });
    }

    function editarFactura(idx) {
        document.getElementById('fac-index').value = idx;
        document.getElementById('fac-numero').value = facturas[idx].numero;
        document.getElementById('fac-cliente').value = facturas[idx].cliente;
        document.getElementById('fac-monto').value = facturas[idx].monto;
        document.getElementById('btn-guardar-fac').innerText = "Actualizar Factura";
    }

    function eliminarFactura(idx) {
        facturas.splice(idx, 1);
        renderFacturas();
    }
</script>

</body>
</html>
